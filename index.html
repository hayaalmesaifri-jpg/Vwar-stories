<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VWAR DIARIES 🎀</title><style>body{font-family:system-ui;background:#fff0f6;color:#884565;margin:0}header{text-align:center;background:#f8c8dc;padding:35px 12px}h1{font-family:Georgia;font-size:32px}.wrap{padding:15px;max-width:650px;margin:auto}.card{background:white;border:1px solid #f2c9dc;border-radius:18px;padding:17px;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #e5aeca;border-radius:12px;font:inherit;margin:7px 0}button{background:#c16b96;color:white;border:0;border-radius:12px;padding:12px;font:inherit;margin:4px;cursor:pointer}.soft{background:#f7d9e7;color:#87466b}.hidden{display:none}.muted{font-size:12px;color:#a6788f}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar{background:#f7d9e7;height:12px;border-radius:20px;overflow:hidden}.fill{height:100%;background:#c16b96;width:0}.item{border:1px solid #f0d3e1;border-radius:12px;padding:12px;margin:10px 0}a{color:#9a4d76}input[type=checkbox]{width:auto;accent-color:#b75d8a}select{padding:9px;border-radius:10px;border:1px solid #ecc1d6}</style><header><div>୨୧ 🎀 ୨୧</div><h1>VWAR DIARIES</h1><div>Our Little Story Club ♡</div></header><main class="wrap"><section id="login" class="card"><h2>هلا فيج 💌</h2><p>اكتبي اسمج وابدئي دفتر قصصج</p><input id="name" placeholder="اسمج الحلو"><button id="enter">ادخلي النادي 🎀</button><p class="muted">نسخة تجريبية على نفس الجهاز، مو تسجيل دخول مشترك.</p></section><section id="app" class="hidden"><div class="card"><div class="row"><h2 id="hello"></h2><button class="soft" id="switch">تغيير الاسم</button></div><p id="progress"></p><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card"><h3>🎬 Story Checklist</h3><p class="muted">أضيفي روابط القصص الحقيقية من قناة VWAR. جلب جميع القصص تلقائيًا يحتاج ربط YouTube API.</p><input id="title" placeholder="اسم القصة"><input id="url" placeholder="رابط فيديو يوتيوب"><button id="add">+ إضافة قصة</button><p id="error" class="muted"></p><input id="search" placeholder="🔎 دوري على قصة"><div id="stories"></div></div></section></main><script>(function(){var $=function(id){return document.getElementById(id)},key='vwar_iphone_v1',data;try{data=JSON.parse(localStorage.getItem(key))||{stories:[],users:{}}}catch(e){data={stories:[],users:{}}}var user='';function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function video(url){try{var u=new URL(url),h=u.hostname.toLowerCase(),v='';if(h==='youtu.be'||h==='www.youtu.be')v=u.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com'].indexOf(h)>=0)v=u.pathname==='/watch'?u.searchParams.get('v'):u.pathname.split('/')[2];return /^[a-zA-Z0-9_-]{11}$/.test(v||'')?v:null}catch(e){return null}}function enter(){var n=$('name').value.trim();if(!n)return;user=n;if(!data.users[n])data.users[n]={};save();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='هلا '+n+'! 💗';render()}$('enter').onclick=enter;$('name').onkeydown=function(e){if(e.key==='Enter')enter()};$('switch').onclick=function(){$('app').classList.add('hidden');$('login').classList.remove('hidden')};$('add').onclick=function(){var t=$('title').value.trim(),v=video($('url').value.trim());if(!t||!v){$('error').textContent='اكتبي عنوان ورابط يوتيوب صحيح 💗';return}if(data.stories.some(function(s){return s.id===v})){ $('error').textContent='القصة موجودة ♡';return}data.stories.push({id:v,title:t});$('title').value='';$('url').value='';$('error').textContent='';save();render()};$('search').oninput=render;function render(){var records=data.users[user],seen=data.stories.filter(function(s){return records[s.id]&&records[s.id].watched}).length;$('progress').textContent=seen+' / '+data.stories.length+' قصة شفتها';$('fill').style.width=(data.stories.length?seen/data.stories.length*100:0)+'%';var arr=data.stories.filter(function(s){return s.title.indexOf($('search').value)>=0});$('stories').innerHTML=arr.length?arr.map(function(s){var r=records[s.id]||{};return '<div class="item" data-id="'+s.id+'"><div class="row"><b>'+esc(s.title)+'</b><label><input type="checkbox" class="watch" '+(r.watched?'checked':'')+'> شفتها</label></div><a href="https://www.youtube.com/watch?v='+s.id+'" target="_blank">▶ مشاهدة</a><p>تقييمي من 10</p><select class="rating">'+Array.from({length:11},function(_,i){return '<option value="'+i+'" '+((r.rating||0)===i?'selected':'')+'>'+ (i||'بدون تقييم')+'</option>'}).join('')+'</select><textarea rows="3" placeholder="رأيي الشخصي 💌">'+esc(r.comment||'')+'</textarea><button class="save">احفظي رأيي ♡</button></div>'}).join(''):'<p class="muted">مكتبتج تنتظر أول قصة 🎀</p>';Array.from(document.querySelectorAll('.item')).forEach(function(el){var id=el.getAttribute('data-id');el.querySelector('.watch').onchange=function(e){data.users[user][id]=Object.assign({},data.users[user][id]||{},{watched:e.target.checked});save();render()};el.querySelector('.save').onclick=function(){data.users[user][id]=Object.assign({},data.users[user][id]||{},{rating:Number(el.querySelector('.rating').value),comment:el.querySelector('textarea').value});save();el.querySelector('.save').textContent='تم الحفظ ✓'}})}})();</script></html>
