<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><title>VWAR | THE SECRET AGENCY</title><style>
:root{--bg:#0b1018;--panel:#171f2a;--line:#33404e;--gold:#e9c681;--red:#b83b3f;--ink:#f2eee7;--muted:#9ba8b6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#243044 0%,#0b1018 53%);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--gold)}.wrap{max-width:1150px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:15px}.brand{font-weight:900;letter-spacing:2px;color:var(--gold);font-size:20px}.small{font-size:12px;color:var(--muted)}.tag{font-size:10px;color:var(--gold);border:1px solid #876c45;border-radius:30px;padding:5px 10px;letter-spacing:2px}.hero{padding:42px 8px 28px;text-align:center;background:radial-gradient(ellipse at center,#6a2a3044,transparent 68%)}h1{font-size:clamp(30px,6vw,60px);line-height:1.1;margin:10px 0;letter-spacing:2px}h2{font-size:22px;margin:0 0 14px}.gold{color:var(--gold)}.muted{color:var(--muted)}.card{background:linear-gradient(135deg,#1c2531,#131b25);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 12px 30px #0003}.btn{background:var(--gold);color:#171b20;border:0;border-radius:9px;padding:11px 15px;font-weight:800}.btn2{background:#293442;color:#f6eee1;border:1px solid #485464;border-radius:9px;padding:10px 14px}.btnred{background:#873137;color:#fff;border:0;border-radius:9px;padding:10px 14px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.story{padding:0;overflow:hidden;display:flex;flex-direction:column}.poster{position:relative;aspect-ratio:16/9;background:linear-gradient(120deg,#243141,#462c34);overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.stamp{position:absolute;top:10px;right:10px;background:#111d25dd;color:var(--gold);font-size:11px;padding:5px 8px;border:1px solid #b79b63}.content{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}.content h3{font-size:15px;line-height:1.65;margin:0;min-height:49px}.pill{border:1px solid #755d46;color:var(--gold);padding:5px 9px;border-radius:30px;font-size:11px}input,textarea,select{width:100%;background:#101823;border:1px solid #4a5664;color:#fff;padding:12px;border-radius:9px;outline:none}input:focus,textarea:focus{border-color:var(--gold)}label{display:block;font-size:13px;margin-bottom:6px;color:#e2d7c7}.formrow{margin:13px 0}.auth{max-width:420px;margin:25px auto}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #44505d;background:#19222e;color:#e7e1d6;border-radius:8px;padding:10px 13px}.tabs button.active{border-color:var(--gold);color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stats .card{text-align:center;padding:13px}.stats b{display:block;font-size:24px;color:var(--gold)}.overlay{position:fixed;inset:0;background:#000b;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{width:min(680px,100%);max-height:94vh;overflow:auto}.stars{display:flex;flex-wrap:wrap;gap:3px;direction:ltr;justify-content:flex-end}.star{background:none;border:0;color:#59606b;font-size:28px;padding:1px 2px}.star.on{color:#e9c681}.notice{border-right:3px solid var(--gold);background:#302a22;padding:12px;border-radius:7px;font-size:13px}.hide{display:none!important}.empty{text-align:center;padding:35px;color:var(--muted)}.footer{text-align:center;padding:35px;color:#8c929a;font-size:12px}.check{accent-color:var(--gold);width:18px;height:18px}.badge{color:#edc987;font-size:12px} .search{display:flex;gap:9px;flex-wrap:wrap}.search input{flex:1;min-width:180px}.search select{width:auto;max-width:190px}@media(max-width:480px){.wrap{padding:12px}.hero{padding:28px 0 18px}.stats b{font-size:20px}.brand{font-size:17px}.card{padding:14px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">◈ VWAR DIARIES</div><div class="small">THE SECRET AGENCY • CASE ARCHIVE</div></div><div class="flex"><span class="tag">CLASSIFIED</span><button id="logout" class="btn2 hide">خروج</button></div></header><div id="app"></div><div class="footer">FAN-MADE • غير تابع رسميًا لقناة VWAR • الفيديوهات ملك لأصحابها</div></div><div id="modal" class="overlay hide"><div class="card dialog" id="modalbody"></div></div>
<script src="config.js"></script><script type="module">
// Public config is injected via config.js; never put secret service-account keys here.
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const cfg=window.VWAR_CONFIG||{},ready=!!(cfg.firebase?.apiKey&&cfg.firebase?.projectId);let auth,db,user=null,stories=[],reviews={},people=[],view='all',selected=null,maxStars=10,loading=false;
if(ready){const a=initializeApp(cfg.firebase);auth=getAuth(a);db=getFirestore(a)}
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=t=>{let m=t.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return m?(+(m[1]||0)*3600+(m[2]||0)*60+(m[3]||0)):0};
const good=s=>s&&s.id&&s.title&&s.duration>=600&&!/#shorts\b/i.test(s.title);
const cacheKey='vwar_agency_cache_1';try{stories=JSON.parse(localStorage.getItem(cacheKey)||'[]')}catch{}
const say=s=>{let n=$('#notice');if(n)n.textContent=s};
function login(){app.innerHTML=`<section class="hero"><div class="tag" style="display:inline-block">ACCESS RESTRICTED • UNIT 007</div><h1>WELCOME TO<br><span class="gold">THE AGENCY</span></h1><p class="muted">كل قصة قضية. كل تقييم تقرير سري.</p></section><section class="card auth"><div class="tabs"><button id="signintab" class="active">تسجيل دخول</button><button id="signuptab">إنشاء حساب</button></div><div id="nickname" class="formrow hide"><label>اسم العميل / العميلة</label><input id="name" autocomplete="nickname" maxlength="35" placeholder="اسمج في الوكالة"></div><div class="formrow"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="email@example.com"></div><div class="formrow"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل"></div><button class="btn" id="submit" style="width:100%">دخول الوكالة ←</button><p id="notice" class="small"></p>${ready?'':'<p class="notice">يلزم تفعيل Firebase في ملف config.js قبل إنشاء حساب حقيقي. لا يوجد دخول تجريبي بكلمة مرور وهمية.</p>'}</section>`;let signup=false;$('#signintab').onclick=()=>toggle(false);$('#signuptab').onclick=()=>toggle(true);function toggle(v){signup=v;$('#nickname').classList.toggle('hide',!v);$('#signintab').classList.toggle('active',!v);$('#signuptab').classList.toggle('active',v);$('#submit').textContent=v?'إنشاء ملف عميل':'دخول الوكالة ←'}$('#submit').onclick=async()=>{if(!ready)return say('فعّلي إعدادات Firebase أولًا.');let email=$('#email').value.trim(),pass=$('#password').value;try{$('#submit').disabled=true;if(signup){let cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:$('#name').value.trim()||'عميل سري'});await setDoc(doc(db,'profiles',cred.user.uid),{name:$('#name').value.trim()||'عميل سري',joined:Date.now()})}else await signInWithEmailAndPassword(auth,email,pass)}catch(e){say('تعذر الدخول: '+e.code)}finally{$('#submit').disabled=false}}}
async function fetchStories(){if(!cfg.youtubeApiKey){say('المكتبة تنتظر ربط YouTube API في config.js.');return}if(loading)return;loading=true;say('جاري جلب أرشيف القناة...');try{let api='https://www.googleapis.com/youtube/v3/',key=encodeURIComponent(cfg.youtubeApiKey),ch=await fetch(api+'channels?part=contentDetails&forHandle=vwar&key='+key).then(r=>r.json());if(ch.error)throw Error(ch.error.message);let playlist=ch.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;if(!playlist)throw Error('لم أتمكن من العثور على قناة VWAR');let ids=[],meta={},token='';do{let p=await fetch(api+'playlistItems?part=snippet,contentDetails&maxResults=50&playlistId='+playlist+'&pageToken='+token+'&key='+key).then(r=>r.json());if(p.error)throw Error(p.error.message);for(let item of p.items||[]){let id=item.contentDetails?.videoId;if(id){ids.push(id);meta[id]={title:item.snippet?.title||'',published:item.contentDetails?.videoPublishedAt||'',thumb:item.snippet?.thumbnails?.medium?.url||''}}}token=p.nextPageToken||''}while(token);let found=[];for(let i=0;i<ids.length;i+=50){let v=await fetch(api+'videos?part=contentDetails,status,snippet&id='+ids.slice(i,i+50).join(',')+'&key='+key).then(r=>r.json());if(v.error)throw Error(v.error.message);for(let x of v.items||[]){let m=meta[x.id],item={id:x.id,title:x.snippet?.title||m.title,duration:dur(x.contentDetails?.duration||''),thumb:x.snippet?.thumbnails?.medium?.url||m.thumb,published:m.published};if(x.status?.privacyStatus==='public'&&good(item))found.push(item)}}stories=found.sort((a,b)=>b.published.localeCompare(a.published));localStorage.setItem(cacheKey,JSON.stringify(stories));say('تم تحميل '+stories.length+' قصة طويلة (10 دقائق فأكثر).');render()}catch(e){say('تعذر تحديث الأرشيف: '+e.message)}finally{loading=false}}
async function loadReviews(){reviews={};if(!db||!user)return;try{let s=await getDocs(collection(db,'users',user.uid,'reviews'));s.forEach(x=>reviews[x.id]=x.data())}catch(e){say('تعذر تحميل تقييماتج: '+e.code)}}
async function loadPeople(){people=[];if(!db||!user)return;try{let s=await getDocs(query(collection(db,'publicReviews'),orderBy('updated','desc'),limit(80)));people=s.docs.map(x=>x.data())}catch(e){say('تعذر عرض آراء الأعضاء: '+e.code)}}
function render(){if(!user){login();return}let count=stories.filter(s=>reviews[s.id]?.watched).length,rate=Object.values(reviews).filter(r=>r.rating).map(r=>r.rating/r.scale*10),average=rate.length?(rate.reduce((a,b)=>a+b,0)/rate.length).toFixed(1):'—';app.innerHTML=`<section class="hero"><div class="tag" style="display:inline-block">AGENT ${esc(user.displayName||'CLASSIFIED')}</div><h1>THE <span class="gold">CASE FILES</span></h1><p class="muted">أرشيف قصص VWAR الطويلة • علّمي القضايا اللي شاهدتيها، واكتبي تقريرج السري</p></section><div class="stats"><div class="card"><b>${stories.length}</b><span class="small">ملف قضية</span></div><div class="card"><b>${count}</b><span class="small">تمت مشاهدتها</span></div><div class="card"><b>${average}</b><span class="small">متوسط تقييمج /10</span></div></div><div class="tabs" id="tabs"><button data-view="all">كل القضايا</button><button data-view="watched">✓ شفتها</button><button data-view="pending">لم أشاهدها</button><button data-view="friends">شبكة العملاء</button></div><div id="library"><div class="search"><input id="search" placeholder="🔎 ابحثي عن اسم القضية..."><select id="sort"><option value="new">الأحدث</option><option value="old">الأقدم</option><option value="top">الأعلى تقييمًا</option></select><button id="refresh" class="btn2">↻ تحديث القصص</button></div><p id="notice" class="small"></p><div id="list" class="grid"></div></div>`;$('#logout').classList.remove('hide');$('#logout').onclick=()=>signOut(auth);$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;paint()});$('#search').oninput=paint;$('#sort').onchange=paint;$('#refresh').onclick=fetchStories;paint();if(!stories.length&&cfg.youtubeApiKey)fetchStories()}
function $$(s){return Array.from(document.querySelectorAll(s))}
function paint(){let isFriends=view==='friends';$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#library .search').classList.toggle('hide',isFriends);let out=$('#list');if(isFriends){out.innerHTML=people.length?people.map(p=>`<div class="card"><div class="badge">AGENT REPORT • ${esc(p.name||'عميل')}</div><h3>${esc(p.title)}</h3><div class="gold">${'★'.repeat(Math.min(10,p.rating||0))} ${p.rating||0}/${p.scale||10}</div><p>${p.spoiler?'⚠️ تعليق يحتوي على حرق — افتحيه بحذر':''}</p><p class="small">${p.spoiler?'مخفي لحماية الأحداث':esc(p.comment||'')}</p>${p.spoiler?`<button class="btn2 spoiler" data-text="${esc(p.comment||'')}">إظهار الحرق</button>`:''}</div>`).join(''):'<div class="empty">لا توجد مراجعات مشتركة بعد.</div>';$$('.spoiler').forEach(b=>b.onclick=()=>{b.outerHTML='<p>'+esc(b.dataset.text)+'</p>'});return}let q=$('#search').value.trim().toLowerCase(),a=stories.filter(s=>s.title.toLowerCase().includes(q)).filter(s=>view==='all'||(view==='watched'?reviews[s.id]?.watched:!reviews[s.id]?.watched));if($('#sort').value==='old')a.reverse();if($('#sort').value==='top')a.sort((x,y)=>(reviews[y.id]?.rating||0)-(reviews[x.id]?.rating||0));out.innerHTML=a.length?a.map(s=>`<article class="card story"><div class="poster"><img loading="lazy" src="${esc(s.thumb||'https://img.youtube.com/vi/'+s.id+'/mqdefault.jpg')}" alt=""><span class="stamp">${reviews[s.id]?.watched?'✓ CASE CLOSED':'● OPEN CASE'}</span></div><div class="content"><h3>${esc(s.title)}</h3><div class="flex between"><span class="pill">${Math.floor(s.duration/60)} MIN</span><span class="badge">${reviews[s.id]?.rating?'★ '+reviews[s.id].rating+'/'+reviews[s.id].scale:'UNRATED'}</span></div><button class="btn" data-case="${s.id}">فتح ملف القضية ←</button></div></article>`).join(''):'<div class="empty">ما في قضايا بهالقسم. إذا المكتبة فاضية، اضغطي «تحديث القصص» بعد تفعيل YouTube API.</div>';$$('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case))}
function openCase(id){let s=stories.find(x=>x.id===id),r=reviews[id]||{},modal=$('#modal');if(!s)return;maxStars=r.scale||10;modal.classList.remove('hide');$('#modalbody').innerHTML=`<div class="flex between"><div class="badge">CLASSIFIED • CASE REPORT</div><button class="btn2" id="close">✕ إغلاق</button></div><h2 style="margin-top:16px">${esc(s.title)}</h2><div class="poster" style="border-radius:9px"><img src="${esc(s.thumb)}" alt=""></div><p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(s.id)}">▶ مشاهدة القصة على YouTube</a></p><label class="flex"><input id="watched" class="check" type="checkbox" style="width:18px" ${r.watched?'checked':''}> شفت هالقصة ✓</label><div class="formrow"><label>نظام التقييم</label><select id="scale"><option value="10" ${maxStars===10?'selected':''}>من 10 نجوم</option><option value="5" ${maxStars===5?'selected':''}>من 5 نجوم</option></select></div><label>تقييم القضية</label><div id="stars" class="stars"></div><div class="formrow"><label>تقريري عن القصة 💬</label><textarea id="comment" rows="3" maxlength="1800" placeholder="شنو رايج بالقصة؟">${esc(r.comment||'')}</textarea></div><div class="formrow"><label>أقوى لقطة في القصة 🎬</label><textarea id="moment" rows="2" maxlength="800" placeholder="أي مشهد ما نسيتيه؟">${esc(r.moment||'')}</textarea></div><label class="flex"><input id="spoiler" class="check" type="checkbox" style="width:18px" ${r.spoiler?'checked':''}> تعليقي يحتوي على حرق للأحداث</label><p class="small">التقرير ينشر لأعضاء الوكالة عند الحفظ؛ لا تكتبي معلومات شخصية.</p><button id="save" class="btn" style="width:100%">حفظ تقرير القضية</button><p id="saveStatus" class="small"></p>`;$('#close').onclick=()=>modal.classList.add('hide');let rating=r.rating||0;function draw(){let el=$('#stars');el.innerHTML=Array.from({length:maxStars},(_,i)=>`<button class="star ${i<rating?'on':''}" data-n="${i+1}" aria-label="${i+1} نجوم">★</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{rating=+b.dataset.n;draw()})}draw();$('#scale').onchange=()=>{maxStars=+$('#scale').value;rating=0;draw()};$('#save').onclick=async()=>{let report={watched:$('#watched').checked,rating,scale:maxStars,comment:$('#comment').value.trim(),moment:$('#moment').value.trim(),spoiler:$('#spoiler').checked,updated:Date.now()};try{$('#save').disabled=true;await setDoc(doc(db,'users',user.uid,'reviews',id),report);await setDoc(doc(db,'publicReviews',user.uid+'_'+id),{...report,id,title:s.title,name:user.displayName||'عميل',uid:user.uid});reviews[id]=report;await loadPeople();modal.classList.add('hide');render()}catch(e){$('#saveStatus').textContent='فشل الحفظ: '+e.code}finally{$('#save').disabled=false}}}
if(ready){onAuthStateChanged(auth,async u=>{user=u;if(u){await Promise.all([loadReviews(),loadPeople()]);render()}else{$('#logout').classList.add('hide');login()}})}else login();
</script></body></html>
