function $$(s){return Array.from(document.querySelectorAll(s))}
function paint(){let isFriends=view==='friends';$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#library .search').classList.toggle('hide',isFriends);let out=$('#list');if(isFriends){out.innerHTML=people.length?people.map(p=>`<div class="card"><div class="badge">AGENT REPORT • ${esc(p.name||'عميل')}</div><h3>${esc(p.title)}</h3><div class="gold">${'★'.repeat(Math.min(10,p.rating||0))} ${p.rating||0}/${p.scale||10}</div><p>${p.spoiler?'⚠️ تعليق يحتوي على حرق — افتحيه بحذر':''}</p><p class="small">${p.spoiler?'مخفي لحماية الأحداث':esc(p.comment||'')}</p>${p.spoiler?`<button class="btn2 spoiler" data-text="${esc(p.comment||'')}">إظهار الحرق</button>`:''}</div>`).join(''):'<div class="empty">لا توجد مراجعات مشتركة بعد.</div>';$$('.spoiler').forEach(b=>b.onclick=()=>{b.outerHTML='<p>'+esc(b.dataset.text)+'</p>'});return}let q=$('#search').value.trim().toLowerCase(),a=stories.filter(s=>s.title.toLowerCase().includes(q)).filter(s=>view==='all'||(view==='watched'?reviews[s.id]?.watched:!reviews[s.id]?.watched));if($('#sort').value==='old')a.reverse();if($('#sort').value==='top')a.sort((x,y)=>(reviews[y.id]?.rating||0)-(reviews[x.id]?.rating||0));out.innerHTML=a.length?a.map(s=>`<article class="card story"><div class="poster"><img loading="lazy" src="${esc(s.thumb||'https://img.youtube.com/vi/'+s.id+'/mqdefault.jpg')}" alt=""><span class="stamp">${reviews[s.id]?.watched?'✓ CASE CLOSED':'● OPEN CASE'}</span></div><div class="content"><h3>${esc(s.title)}</h3><div class="flex between"><span class="pill">${Math.floor(s.duration/60)} MIN</span><span class="badge">${reviews[s.id]?.rating?'★ '+reviews[s.id].rating+'/'+reviews[s.id].scale:'UNRATED'}</span></div><button class="btn" data-case="${s.id}">🔎 فتح ملف التحقيق ←</button></div></article>`).join(''):'<div class="empty">ما في قضايا بهالقسم. إذا المكتبة فاضية، اضغطي «تحديث القصص» بعد تفعيل YouTube API.</div>';$$('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case))}
function openCase(id){let s=stories.find(x=>x.id===id),r=reviews[id]||{},modal=$('#modal');if(!s)return;maxStars=r.scale||10;modal.classList.remove('hide');$('#modalbody').innerHTML=`<div class="flex between"><div class="badge">CLASSIFIED • CASE REPORT</div><button class="btn2" id="close">✕ إغلاق</button></div><h2 style="margin-top:16px">${esc(s.title)}</h2><div class="poster" style="border-radius:9px"><img src="${esc(s.thumb)}" alt=""></div><p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(s.id)}">▶ مشاهدة القصة على YouTube</a></p><label class="flex"><input id="watched" class="check" type="checkbox" style="width:18px" ${r.watched?'checked':''}> شفت هالقصة ✓</label><div class="formrow"><label>نظام التقييم</label><select id="scale"><option value="10" ${maxStars===10?'selected':''}>من 10 نجوم</option><option value="5" ${maxStars===5?'selected':''}>من 5 نجوم</option></select></div><label>تقييم القضية</label><div id="stars" class="stars"></div><div class="formrow"><label>محضر التحقيق: رأيي في القضية 💬</label><textarea id="comment" rows="3" maxlength="1800" placeholder="شنو رايج بالقصة؟">${esc(r.comment||'')}</textarea></div><div class="formrow"><label>الدليل الأبرز: أقوى لقطة 🎬</label><textarea id="moment" rows="2" maxlength="800" placeholder="أي مشهد ما نسيتيه؟">${esc(r.moment||'')}</textarea></div><label class="flex"><input id="spoiler" class="check" type="checkbox" style="width:18px" ${r.spoiler?'checked':''}> تعليقي يحتوي على حرق للأحداث</label><p class="small">التقرير ينشر لأعضاء الوكالة عند الحفظ؛ لا تكتبي معلومات شخصية.</p><button id="save" class="btn" style="width:100%">📁 اعتماد تقرير التحقيق</button><p id="saveStatus" class="small"></p>`;$('#close').onclick=()=>modal.classList.add('hide');let rating=r.rating||0;function draw(){let el=$('#stars');el.innerHTML=Array.from({length:maxStars},(_,i)=>`<button class="star ${i<rating?'on':''}" data-n="${i+1}" aria-label="${i+1} نجوم">★</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{rating=+b.dataset.n;draw()})}draw();$('#scale').onchange=()=>{maxStars=+$('#scale').value;rating=0;draw()};$('#save').onclick=async()=>{let report={watched:$('#watched').checked,rating,scale:maxStars,comment:$('#comment').value.trim(),moment:$('#moment').value.trim(),spoiler:$('#spoiler').checked,updated:Date.now()};try{$('#save').disabled=true;await set(ref(db,'users/'+user.uid+'/reviews/'+id),report);await set(ref(db,'publicReviews/'+user.uid+'_'+id),{...report,id,title:s.title,name:user.displayName||'عميل',uid:user.uid});reviews[id]=report;await loadPeople();modal.classList.add('hide');render()}catch(e){$('#saveStatus').textContent='فشل الحفظ: '+e.code}finally{$('#save').disabled=false}}}
if(ready){onAuthStateChanged(auth,async u=>{user=u;if(u){await Promise.all([loadReviews(),loadPeople()]);render()}else{$('#logout').classList.add('hide');login()}})}else login();
</script></body></html>
